
services:
  dashboard:
    build:
      context: ./log-display
      dockerfile: ../Dockerfile
    container_name: infralogs-dashboard
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - PORT=5000
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - infralog-network

networks:
  infralog-network:
    driver: bridge

